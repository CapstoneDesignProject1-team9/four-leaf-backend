# =============================================================
# [four-leaf-backend] CI Pipeline
# 경로: .github/workflows/ci.yml
#
# 트리거: PR 생성/업데이트, main 브랜치 push
# 단계:
#   1. JDK 21 설치
#   2. Maven 빌드
#   3. 단위 테스트 실행 (test 프로파일 / H2 인메모리 DB)
#   4. 테스트 리포트 업로드
# =============================================================

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Backend CI (Maven Build & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven   # ~/.m2 캐시

      - name: Build with Maven
        run: mvn compile -B

      - name: Run tests (H2 인메모리 DB)
        run: mvn test -B
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Package JAR (테스트 제외)
        run: mvn package -DskipTests -B

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.sha }}
          path: target/surefire-reports/
          retention-days: 7
